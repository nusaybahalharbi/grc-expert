<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>GRC Expert — AI-Powered Saudi & International Compliance Platform</title>
<meta name="description" content="Enterprise AI GRC platform with NCA, SAMA, CST, SDAIA, ISO 27001, SOC 2, NIST CSF and more. Built for Saudi compliance professionals.">
<meta name="theme-color" content="#060912">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- App styles -->
<link rel="stylesheet" href="/app/styles.css">

<!-- File parsing libraries (loaded from CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body>

<div class="app">
  <!-- Decorative background -->
  <div class="bg-decoration"></div>

  <!-- Mobile overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-header">
      <div class="brand">
        <div class="brand-logo">GRC</div>
        <div class="brand-meta">
          <div class="brand-name">GRC Expert</div>
          <div class="brand-tag">AI Platform</div>
        </div>
      </div>
    </div>

    <nav class="sb-nav">
      <div class="nav-label">Workspace</div>
      <div id="workspaceNav"></div>

      <div class="nav-label">Generators</div>
      <div id="generatorsNav"></div>

      <div class="nav-label">Library</div>
      <div id="sourcesNav"></div>

      <button class="fw-toggle" id="fwToggle">
        <span>Frameworks</span>
        <svg class="fw-toggle-icon" width="10" height="10" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="3"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <div class="fw-list" id="fwList"></div>
    </nav>

    <div class="sb-footer">
      <button class="btn-primary" id="newChatBtn">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Conversation
      </button>
      <div class="theme-toggle-row">
        <span class="theme-toggle-text">Dark</span>
        <button class="theme-toggle" id="themeToggle">
          <svg width="11" height="11" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          Toggle
        </button>
      </div>
      <div class="credit">
        Built by <strong>Nusaybah AlHarbi</strong><br>
        Powered by Gemini AI
      </div>
    </div>
  </aside>

  <!-- ============ MAIN AREA ============ -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger" aria-label="Open menu">
          <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="page-title">
          <h1 id="topTitle">AI GRC Assistant</h1>
          <span class="fw-pill" id="topCtx">All Frameworks</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="kb-status loading" id="kbStatus">
          <div class="kb-status-dot"></div>
          <span class="kb-status-text">Loading KB...</span>
        </div>
      </div>
    </header>

    <div class="chat-area" id="chatArea">
      <!-- Welcome screen / messages / page content rendered here -->
    </div>

    <!-- File processing indicator -->
    <div class="file-processing" id="fileProcessing" style="display:none;">
      <div class="file-spin"></div>
      <span id="procText">Processing file...</span>
    </div>

    <!-- Input bar -->
    <div class="input-bar" id="inputBar">
      <div class="input-wrapper">
        <div class="attached-files" id="attached"></div>
        <div class="input-row">
          <button class="icon-btn" id="uploadBtn" title="Attach file (PDF, Word, Excel, CSV, TXT)" aria-label="Upload file">
            <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input type="file" id="fileInput" accept=".pdf,.docx,.doc,.xlsx,.xls,.csv,.txt,.md">
          <textarea id="ta" rows="1" placeholder="Ask GRC Expert anything..." aria-label="Message input"></textarea>
          <button class="send-btn" id="sendBtn" title="Send (Enter)" aria-label="Send message">
            <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          </button>
        </div>
      </div>
      <div class="input-meta">
        <div class="input-meta-left">
          <span>Press Enter to send · Shift+Enter for new line</span>
        </div>
        <div>GRC Expert v2.0 · Phase 1</div>
      </div>
    </div>
  </main>
</div>

<!-- App modules - load order matters -->
<script src="/app/sources.js"></script>
<script src="/app/ui.js"></script>
<script src="/app/storage.js"></script>
<script src="/app/retrieval.js"></script>
<script src="/app/parsers.js"></script>
<script src="/app/app.js"></script>

<!-- Configure PDF.js worker after libraries load -->
<script>
window.addEventListener('load', function() {
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  // Wire framework toggle
  var fwToggle = document.getElementById('fwToggle');
  var fwList = document.getElementById('fwList');
  if (fwToggle && fwList) {
    fwToggle.addEventListener('click', function() {
      fwList.classList.toggle('open');
      fwToggle.classList.toggle('open');
    });
  }
});
</script>

</body>
</html>
